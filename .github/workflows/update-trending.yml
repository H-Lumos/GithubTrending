name: Update trending data

# 每天抓一次 GitHub 官方 Trending → 写进 web/data/trending.js → 提交 → 部署 Pages
#
# 两个注意点：
# 1) 抓取和部署必须在【同一个 job】里。拆成两个 job 时 deploy 会检出触发时的旧提交，
#    抓取到的新数据根本不会被部署（踩过）。
# 2) 钉死 ubuntu-24.04 而不是 ubuntu-latest：GitHub 会在 2026-10-19 把 latest
#    迁到 Ubuntu 26，钉版本可避免镜像变更带来的意外。
on:
  schedule:
    # UTC 00:17 ≈ 北京时间 08:17（GitHub 的 cron 可能延迟几分钟到几十分钟）
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-trending
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 抓取官方榜单并生成数据
        env:
          # 在仓库 Settings → Secrets and variables → Actions 里配置
          # 没配也能跑：缺中文的条目回落 GitHub 官方英文描述
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_MODEL: deepseek-chat
          ZH_MAX_PER_RUN: '12'
        run: node scripts/snapshot.js

      - name: 有变化就提交（失败不影响部署）
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/trending.js miniprogram/data/snapshot.js data/history.json data/zh-auto.json
          if git diff --staged --quiet; then
            echo "数据没有变化，跳过提交"
          else
            git commit -m "chore(data): update trending $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v5
