name: Update trending data

# 每天抓一次 GitHub 官方 Trending → 写进 web/data/trending.js → 提交 → 部署 Pages
# 关键点：抓取和部署必须在【同一个 job】里。
# 分成两个 job 时 deploy 会检出触发时的旧提交，抓取到的新数据根本不会被部署（踩过）。
on:
  schedule:
    # UTC 00:17 ≈ 北京时间 08:17
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-trending
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取官方榜单并生成数据
        run: node scripts/snapshot.js

      - name: 有变化就提交（失败不影响部署）
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/trending.js miniprogram/data/snapshot.js
          if git diff --staged --quiet; then
            echo "榜单没有变化，跳过提交"
          else
            git commit -m "chore(data): update trending $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
