<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GithubTrending · GitHub 趋势榜（中英对照）</title>
    <meta
      name="description"
      content="GitHub Trending 每日 / 每周 / 每月榜单，中文用途说明 + 原英文描述 + star 走势。"
    />
    <link rel="icon" href="assets/icon.png" />
    <link rel="stylesheet" href="assets/app.css?v=39df8431" />
  </head>
  <body>
    <header class="top">
      <div class="wrap top-inner">
        <div class="brand">
          <span class="kick">GITHUB TRENDING</span>
          <h1>Trending</h1>
        </div>
        <div class="top-actions">
          <button id="btnFav" class="icon-btn" title="只看收藏" aria-label="只看收藏">
            ★<span class="badge" id="favCount"></span>
          </button>
          <button id="btnTheme" class="icon-btn" title="切换深浅色" aria-label="切换深浅色">◐</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div class="sub">
        <span id="updated">加载中…</span>
        <span class="dot">·</span>
        <span id="count"></span>
        <span class="src" id="source"></span>
      </div>

      <nav class="seg" id="seg" role="tablist" aria-label="榜单周期"></nav>

      <div class="chips" id="chips"></div>

      <div class="search">
        <span class="s-ico">⌕</span>
        <input
          id="q"
          type="search"
          placeholder="搜索仓库名 / 中文用途 / 标签"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="s-clear" id="qClear" hidden aria-label="清空">✕</button>
      </div>

      <div class="listhead">
        <span id="sortLabel"></span>
        <b id="total"></b>
      </div>

      <div class="grid" id="list"></div>

      <footer class="foot">
        <div id="foot-warn" class="warn" hidden></div>
        <div>数据来源：<a href="https://github.com/trending" target="_blank" rel="noopener">github.com/trending</a> 官方页面</div>
        <div id="foot-zh">中文用途：人工对照表 + DeepSeek 自动补齐（AI 生成的会在详情页标注）；每个项目同时保留 GitHub 上的原英文描述</div>
        <div>零成本静态站：GitHub Actions 每日抓取 → GitHub Pages 托管，无服务器、无数据库</div>
      </footer>
    </main>

    <div class="scrim" id="scrim"></div>

    <aside class="drawer" id="drawer" aria-hidden="true" aria-label="项目详情">
      <div class="drawer-top">
        <span class="t">项目详情</span>
        <button class="icon-btn" id="btnClose" aria-label="关闭">✕</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>

    <script src="data/trending.js"></script>
    <script src="assets/app.js?v=62aa7169"></script>
  </body>
</html>
